  <text x="194" y="138" text-anchor="middle" font-size="11">Session cookie</text>
  <line x1="410" y1="150" x2="478" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="444" y="138" text-anchor="middle" font-size="11">SQL</text>
  <line x1="160" y1="90" x2="700" y2="60" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="160" y1="110" x2="700" y2="140" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="480" y1="190" x2="700" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="285" text-anchor="middle" font-size="12" fill="#555">workspace-monitor v2.2 — Streamlit frontend, Flask app, local SQLite. External services are demo-only.</text>
