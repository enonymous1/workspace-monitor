<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="10" y="110" width="150" height="80" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="85" y="140" text-anchor="middle" font-size="14" font-weight="600">Browser</text>
  <text x="85" y="160" text-anchor="middle" font-size="12">Flask templates</text>
  <text x="85" y="176" text-anchor="middle" font-size="12">(home + 10 pages)</text>
  <rect x="230" y="110" width="180" height="80" rx="10" fill="#e6f4ea" stroke="#188038"/>
  <text x="320" y="140" text-anchor="middle" font-size="14" font-weight="600">Flask app</text>
  <text x="320" y="160" text-anchor="middle" font-size="12">auth · blueprints · services</text>
  <text x="320" y="176" text-anchor="middle" font-size="12">Session + role checks</text>
  <rect x="480" y="110" width="160" height="80" rx="10" fill="#fef7e0" stroke="#b06000"/>
  <text x="560" y="140" text-anchor="middle" font-size="14" font-weight="600">SQLite</text>
  <text x="560" y="160" text-anchor="middle" font-size="12">workspace_monitor/monitor.db</text>
  <text x="560" y="176" text-anchor="middle" font-size="12">WAL · indexed · FK on</text>
  <rect x="700" y="30" width="170" height="60" rx="10" fill="#f3e8fd" stroke="#8430ce"/>
  <text x="785" y="55" text-anchor="middle" font-size="13" font-weight="600">Nominatim</text>
  <text x="785" y="73" text-anchor="middle" font-size="12">geocoding (distance only)</text>
  <rect x="700" y="110" width="170" height="60" rx="10" fill="#f3e8fd" stroke="#8430ce"/>
  <text x="785" y="135" text-anchor="middle" font-size="13" font-weight="600">OSRM</text>
  <text x="785" y="153" text-anchor="middle" font-size="12">routing (distance only)</text>
  <rect x="700" y="200" width="170" height="60" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="785" y="225" text-anchor="middle" font-size="13" font-weight="600">seed_demo.py</text>
