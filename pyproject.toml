[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-workspaceMonitor"
version = "2.1.0"
description = "Workspace dashboard: attendance, schedule, mileage, directory, and distance calculator (FastAPI + Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "email-validator==2.2.0",
    "PyJWT==2.10.1",
    "bcrypt==4.1.3",
    "streamlit==1.41.1",
    "streamlit-calendar==0.6.0",
    "streamlit-js-eval==0.1.7",
    "pandas==2.2.3",
    "polyline==2.0.2",
    "openpyxl==3.1.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools]
# The code lives under src/ as top-level api/models/utils packages
# (imported that way by the FastAPI app and the Streamlit pages).
packages = ["api", "models", "utils"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
