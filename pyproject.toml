[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-monitor"
version = "3.2.1"
description = "Workspace dashboard: attendance, schedule, mileage, directory, and distance calculator (Flask + Jinja2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask==3.1.0",
    "bcrypt==4.1.3",
    "email-validator==2.2.0",
    "openpyxl==3.1.2",
    "polyline==2.0.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
]

[project.scripts]
workspace-monitor = "workspace_monitor.__main__:main"

[tool.setuptools]
# Top-level workspace_monitor package (templates and static files
# are package data, so pip installs carry the UI with the code).
packages = ["workspace_monitor", "workspace_monitor.routes"]

[tool.setuptools.package-data]
workspace_monitor = [
    "templates/*.html",
    "templates/components/*.html",
    "static/*.css",
    "static/vendor/*",
    "static/vendor/fonts/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
